<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>로그인 | A.O.M 건축 사전 검토</title>
<meta name="theme-color" content="#F37021">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--aom:#F37021;--red:#e8382f;--ink:#303236;--muted:#6b6d70;--line:#dededb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Pretendard,"맑은 고딕","Malgun Gothic",sans-serif;background:#f5f5f4;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px;word-break:keep-all}
  .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--aom);border-radius:10px;padding:36px 32px 26px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.08)}
  .brand{font-size:15px;color:#595959;letter-spacing:-.4px;margin-bottom:20px}
  .brand span{color:var(--red);font-size:26px;font-weight:700;margin-right:6px;letter-spacing:-1.2px}
  h1{font-size:21px;margin:0 0 8px;font-weight:700;letter-spacing:-.5px}
  .sub{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.65}
  .opts{display:flex;flex-direction:column;gap:10px}
  .gbox{display:flex;justify-content:center;min-height:44px}
  .sbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:44px;border-radius:6px;border:0;font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%}
  .sbtn svg{width:18px;height:18px;flex:none}
  .naver{background:#03C75A;color:#fff}.naver:hover{background:#02b351}
  .kakao{background:#FEE500;color:rgba(0,0,0,.85)}.kakao:hover{background:#f5dc00}
  .sbtn[disabled]{opacity:.45;cursor:not-allowed}
  .msg{min-height:1.4em;margin:16px 0 0;font-size:13.5px;color:var(--muted)}
  .msg.err{color:#C62828}
  .foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.7}
  .foot a{color:var(--muted)}
  .back{display:inline-block;margin-top:8px;font-size:13px;color:var(--ink)}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span>A.O.M</span>종합건축사사무소</div>
  <h1>건축 사전 검토 로그인</h1>
  <p class="sub">조회·계산은 로그인 없이, 자료 받기는 로그인 후 이용합니다.<br>조회한 주소는 다른 기기에서도 이어 봅니다.</p>
  <div class="opts">
    <div class="gbox" id="g"></div>
    <button type="button" class="sbtn naver" id="nv"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M15.6 12.8 8.2 2H2v20h6.4V11.2L15.8 22H22V2h-6.4z"/></svg>네이버 로그인</button>
    <button type="button" class="sbtn kakao" id="kk"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.3 4.7 6.6l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.4 0 .9.1 1.3.1 5.5 0 10-3.5 10-7.9S17.5 3 12 3z"/></svg>카카오 로그인</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <div class="foot">
    로그인 시 서비스 식별용 고유번호와 별명만 저장합니다.<br>
    <a href="/privacy">개인정보처리방침</a><br>
    <a class="back" href="/">← 건축 사전 검토로 돌아가기</a>
  </div>
</main>
<script src="/js/aom-login.js"></script>
<script>
(function(){
  'use strict';
  var C = window.AOM_LOGIN_CONF, ORIGIN = location.origin, CB = ORIGIN + '/login';
  var msg = document.getElementById('msg');
  function say(t, err){ msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }
  function ss(k, v){ try{ if(v === undefined) return sessionStorage.getItem(k); if(v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){ return null; } }
  function rand(){ var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); }
  function finish(j){
    try{ localStorage.setItem('aom_token', j.token); localStorage.setItem('aom_user', JSON.stringify(j.user)); }catch(e){}
    ss('aom_state', null);
    say(j.user.name + ' 님, 환영합니다. 이동 중…');
    location.replace('/');
  }
  function post(path, body){
    say('로그인 확인 중…');
    return fetch(C.api + '/' + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || '로그인 실패'); return j; }); })
      .then(finish)
      .catch(function(e){ say(e.message + ' — 다시 시도해 주십시오.', true); });
  }
  var qs = new URLSearchParams(location.search), h = new URLSearchParams((location.hash || '').slice(1));
  if (h.get('access_token')) {
    var st = h.get('state'); history.replaceState(null, '', location.pathname);
    if (!st || st !== ss('aom_state')) say('보안 확인에 실패했습니다. 다시 로그인해 주십시오.', true);
    else { post('naver', { accessToken: h.get('access_token') }); return; }
  } else if (qs.get('code')) {
    var st2 = qs.get('state'); history.replaceState(null, '', location.pathname);
    if (!st2 || st2 !== ss('aom_state')) say('보안 확인에 실패했습니다. 다시 로그인해 주십시오.', true);
    else { post('kakao', { code: qs.get('code'), redirectUri: CB, clientKey: C.kakao }); return; }
  } else if (qs.get('error') || h.get('error')) say('로그인이 취소되었습니다.', true);

  var gs = document.createElement('script');
  gs.src = 'https://accounts.google.com/gsi/client'; gs.async = true;
  gs.onload = function(){
    google.accounts.id.initialize({ client_id: C.google, callback: function(res){ post('google', { credential: res.credential }); }, ux_mode: 'popup' });
    google.accounts.id.renderButton(document.getElementById('g'), { theme:'outline', size:'large', text:'signin_with', shape:'rectangular', locale:'ko', width: Math.min(336, document.getElementById('g').offsetWidth || 336) });
  };
  document.head.appendChild(gs);
  document.getElementById('nv').onclick = function(){
    var s = 'nv' + rand(); ss('aom_state', s);
    location.href = 'https://nid.naver.com/oauth2.0/authorize?response_type=token&client_id=' + encodeURIComponent(C.naver) + '&redirect_uri=' + encodeURIComponent(CB) + '&state=' + s;
  };
  var kk = document.getElementById('kk');
  if (!C.kakao) { kk.disabled = true; kk.lastChild.textContent = '카카오 로그인 (준비 중)'; }
  else kk.onclick = function(){
    var s = 'kk' + rand(); ss('aom_state', s);
    location.href = 'https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=' + encodeURIComponent(C.kakao) + '&redirect_uri=' + encodeURIComponent(CB) + '&state=' + s;
  };
})();
</script>
</body>
</html>
